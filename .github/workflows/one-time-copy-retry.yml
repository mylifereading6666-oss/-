name: One-time repository copy (retry safely)
on:
  push:
    branches: [main]
    paths:
      - ".copy-trigger-3"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Copy source files
        run: |
          git clone --depth 1 https://github.com/mylifereading6666-oss/fortnite-sprite-checklist.git /tmp/source
          rsync -a --exclude='.git/' --exclude='.github/workflows/sync-upstream-mirror.yml' /tmp/source/ ./
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/one-time-copy-retry.yml .copy-trigger-3
      - name: Commit, rebase remote changes, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi
          git commit -m "Copy Fortnite sprite checklist source files"
          git pull --rebase origin main
          git push origin HEAD:main
