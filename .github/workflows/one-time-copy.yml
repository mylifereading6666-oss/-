name: One-time repository copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repository once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mylifereading6666-oss/fortnite-sprite-checklist.git /tmp/source
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/sync-upstream-mirror.yml' /tmp/source/ ./
          rm -f .github/workflows/one-time-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to copy."
            exit 0
          fi
          git commit -m "Copy fortnite-sprite-checklist as independent repository"
          git push origin HEAD:main
